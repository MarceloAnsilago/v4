<article class="panel preview-rail-panel">
    <div class="panel-header">
        <div>
            <h3>Preview do arquivo .set</h3>
            <p class="panel-subtitle">Resultado gerado com os valores atuais.</p>
        </div>
    </div>

    <form method="post" action="{{ url_for('import_set') }}" enctype="multipart/form-data" class="set-upload-form">
        <input type="hidden" name="target_endpoint" value="{{ set_import_target }}">
        <label for="set_file_upload_shared" class="field-help">Subir `.set` existente</label>
        <input id="set_file_upload_shared" name="set_file" type="file" accept=".set,text/plain">
        <button type="submit" class="secondary-button">Carregar no GeraSet</button>
    </form>

    <div class="preview-block">{{ unified_set_content }}</div>

    <form method="post" action="{{ url_for('grupo_1_download') }}" class="download-form">
        <input type="hidden" name="robot" value="{{ robot_name }}">
        {% for group_values in all_group_values.values() %}
        {% for field_name, field_value in group_values.items() %}
        <input type="hidden" name="{{ field_name }}" value="{{ field_value }}">
        {% endfor %}
        {% endfor %}
        <button type="submit" class="primary-button">Baixar {{ download_filename }}</button>
    </form>
</article>
